<title>Clips Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: eine schmale Spalte, oben Eingabe, darunter Karten nach Dringlichkeit (Freigabe zuerst). */
:root {
  --bg: #f3f4f7;
  --surface: #ffffff;
  --fg: #171a24;
  --muted: #5d6273;
  --line: #dfe2ea;
  --accent: #3442c9;
  --accent-fg: #ffffff;
  --accent-soft: #e6e8fa;
  --ok: #1d7a46;
  --ok-soft: #e1f2e8;
  --warn: #9a5a00;
  --warn-soft: #fff1d9;
  --bad: #b3261e;
  --bad-soft: #fbe5e3;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12141b; --surface: #1b1e28; --fg: #e9ebf2; --muted: #9ba0b2; --line: #2d3140;
    --accent: #8f9bff; --accent-fg: #10132a; --accent-soft: #262b4d;
    --ok: #6fd39a; --ok-soft: #173424; --warn: #f2b65a; --warn-soft: #3a2b12;
    --bad: #ff8a80; --bad-soft: #3e1d1b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12141b; --surface: #1b1e28; --fg: #e9ebf2; --muted: #9ba0b2; --line: #2d3140;
  --accent: #8f9bff; --accent-fg: #10132a; --accent-soft: #262b4d;
  --ok: #6fd39a; --ok-soft: #173424; --warn: #f2b65a; --warn-soft: #3a2b12;
  --bad: #ff8a80; --bad-soft: #3e1d1b;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
.wrap { max-width: 720px; margin: 0 auto; display: grid; gap: 20px; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--font-display); font-size: 1.75rem; margin: 0; letter-spacing: -0.01em; }
.summary { color: var(--muted); font-size: 0.875rem; font-variant-numeric: tabular-nums; }
.summary b { color: var(--warn); font-weight: 600; }

/* Eingabe */
form.add { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 10px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row > * { min-width: 0; }
label.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
input, textarea {
  font: inherit; color: var(--fg); background: var(--bg);
  border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; width: 100%;
}
textarea { resize: vertical; min-height: 72px; }
input:focus-visible, textarea:focus-visible, button:focus-visible, a:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#topic { flex: 1 1 260px; font-size: 1rem; }
#len { flex: 0 0 120px; }
#note { flex: 1 1 200px; }
button {
  font: inherit; font-weight: 600; cursor: pointer; border-radius: 8px; padding: 10px 16px;
  border: 1px solid transparent; min-height: 44px;
}
button:disabled { opacity: .55; cursor: default; }
.btn-primary { background: var(--accent); color: var(--accent-fg); }
.btn-ok { background: var(--ok); color: var(--surface); }
.btn-bad { background: var(--surface); color: var(--bad); border-color: var(--bad); }
.btn-quiet { background: transparent; color: var(--muted); border-color: var(--line); font-weight: 500; padding: 6px 12px; min-height: 36px; }
.hint { color: var(--muted); font-size: 0.8125rem; margin: 0; }
.msg { font-size: 0.875rem; margin: 0; }
.msg.err { color: var(--bad); }

/* Karten */
#list { display: grid; gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.card.attn { border-color: var(--warn); box-shadow: 0 0 0 1px var(--warn) inset; }
.card-head { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.card-head > div { min-width: 0; }
h2 { font-family: var(--font-display); font-size: 1.2rem; margin: 0; text-wrap: balance; overflow-wrap: anywhere; }
.meta { color: var(--muted); font-size: 0.8125rem; font-variant-numeric: tabular-nums; }
.meta span + span::before { content: " · "; }
.pill { flex: none; font-size: 0.75rem; font-weight: 600; letter-spacing: .03em; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.idle { background: var(--bg); color: var(--muted); }

.steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.steps li { font-size: 0.75rem; color: var(--muted); display: grid; gap: 5px; min-width: 0; }
.steps li::before { content: ""; height: 6px; border-radius: 3px; background: var(--line); }
.steps li.past::before { background: var(--ok); }
.steps li.now::before { background: var(--accent); }
.steps li.now { color: var(--fg); font-weight: 600; }
.steps li.fail::before { background: var(--bad); }
.steps li span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.status { margin: 0; overflow-wrap: anywhere; }
.status.err { color: var(--bad); }
.note { margin: 0; color: var(--muted); font-size: 0.875rem; overflow-wrap: anywhere; }

.review { border-top: 1px solid var(--line); padding-top: 12px; display: grid; gap: 10px; min-width: 0; }
.review h3 { margin: 0; font-size: 0.8125rem; text-transform: uppercase; letter-spacing: .05em; color: var(--warn); }
.review .rtitle { font-weight: 600; margin: 0; }
.script { font-family: var(--font-body); white-space: pre-wrap; font-size: 0.9375rem; background: var(--bg); border-radius: 8px; padding: 12px; margin: 0; max-height: 360px; overflow: auto; overflow-wrap: anywhere; }
.review img { width: 100%; border-radius: 8px; border: 1px solid var(--line); display: block; }
details { font-size: 0.875rem; }
summary { cursor: pointer; font-weight: 600; padding-block: 4px; }
.sources { margin: 8px 0 0; padding-left: 18px; display: grid; gap: 10px; }
.sources li { overflow-wrap: anywhere; }
.sources q { color: var(--muted); display: block; font-style: italic; }
a { color: var(--accent); }
.decide { display: grid; gap: 8px; }
.decide .row button { flex: 1 1 140px; }
.saved { background: var(--bg); border-radius: 8px; padding: 10px 12px; display: grid; gap: 6px; }
.saved p { margin: 0; overflow-wrap: anywhere; }
.saved .who { font-weight: 600; }
.saved .who.ok { color: var(--ok); }
.saved .who.bad { color: var(--bad); }
.done-box { display: grid; gap: 8px; }
.done-box video { width: 100%; max-width: 360px; border-radius: 8px; background: var(--bg); }
.tc { font-family: var(--font-mono); font-size: 0.8125rem; }
.foot { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.banner { background: var(--bad-soft); color: var(--bad); border-radius: 8px; padding: 10px 12px; font-weight: 600; margin: 0; overflow-wrap: anywhere; }
.metrics { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 0.8125rem; color: var(--muted); font-variant-numeric: tabular-nums; margin: 0; }
.metrics .off { color: var(--warn); font-weight: 600; }
.metrics .good { color: var(--ok); }
.bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); }
.progress { display: grid; gap: 4px; font-size: 0.8125rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.fix { background: var(--warn-soft); border-radius: 8px; padding: 10px 12px; display: grid; gap: 6px; font-size: 0.875rem; }
.fix strong { color: var(--warn); }
.fix ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.fix li { overflow-wrap: anywhere; }
select { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; min-height: 44px; max-width: 100%; }
#voice { flex: 0 0 230px; }
.listen { flex: none; min-height: 44px; }
.wake { font-size: 0.8125rem; margin: 0; color: var(--muted); }
.wake.ok { color: var(--ok); }
.wake.warn { color: var(--warn); }
.insp-pick { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.insp-pick input[type=file], .card input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; }
.filebtn { cursor: pointer; font-weight: 600; font-size: 0.875rem; color: var(--accent); border: 1px dashed var(--accent); border-radius: 8px; padding: 8px 12px; min-height: 40px; display: inline-flex; align-items: center; }
.filebtn:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.insp { display: grid; gap: 6px; }
.insp-title { font-size: 0.8125rem; color: var(--muted); margin: 0; }
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 6px; }
.thumbs a { display: block; aspect-ratio: 1; max-width: 100%; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); background: var(--bg); color: var(--accent); font-size: 0.75rem; text-decoration: none; }
.thumbs img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumbs a.file { display: grid; place-items: center; padding: 6px; text-align: center; overflow-wrap: anywhere; }
.pub { border-top: 1px solid var(--line); padding-top: 10px; }
.pub > summary { color: var(--accent); }
.plat { display: grid; gap: 6px; margin-top: 10px; padding: 10px 12px; background: var(--bg); border-radius: 8px; min-width: 0; }
.plat h4 { margin: 0; font-size: 0.8125rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.plat .txt { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 0.875rem; }
.plat .tags { margin: 0; color: var(--accent); font-size: 0.875rem; overflow-wrap: anywhere; }
.plat .lbl { font-size: 0.75rem; color: var(--muted); margin: 0; }
.plat .warn { font-size: 0.75rem; color: var(--warn); margin: 0; }
.copyrow { display: flex; gap: 6px; flex-wrap: wrap; }
.ht { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
.ht > summary { font-weight: 600; }
.ht .sub { font-size: 0.8125rem; color: var(--muted); font-weight: 400; }
.ht h3 { font-size: 0.8125rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 14px 0 6px; }
.ht-scroll { overflow-x: auto; }
.ht table { border-collapse: collapse; width: 100%; font-size: 0.8125rem; font-variant-numeric: tabular-nums; }
.ht th, .ht td { text-align: left; padding: 6px 8px 6px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.ht th { color: var(--muted); font-weight: 500; }
.ht td.tag { color: var(--accent); font-weight: 600; white-space: nowrap; }
.ht .up { color: var(--ok); } .ht .down { color: var(--bad); } .ht .new { color: var(--warn); }
.ht .combo { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 4px 0; }
.ht .combo code { font-family: var(--font-mono); font-size: 0.8125rem; color: var(--accent); overflow-wrap: anywhere; }
.ht ul.notes { margin: 6px 0 0; padding-left: 18px; font-size: 0.8125rem; color: var(--muted); display: grid; gap: 4px; }
.empty { text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 12px; padding: 28px 16px; margin: 0; }
@media (max-width: 480px) {
  .steps li span { font-size: 0.6875rem; }
  #len { flex: 1 1 100px; }
  #voice { flex: 1 1 180px; }
}
@media (prefers-reduced-motion: no-preference) {
  .card { transition: border-color .2s; }
}
</style>

<div class="wrap">
  <header>
    <h1>Clips Studio</h1>
    <div class="summary" id="summary">Lade …</div>
  </header>

  <form class="add" id="addForm" autocomplete="off">
    <div class="row">
      <label class="sr" for="topic">Thema</label>
      <input id="topic" name="topic" placeholder="Neues Thema, z. B. Wie Haie schlafen" maxlength="140" required>
    </div>
    <div class="row">
      <label class="sr" for="len">Wunschlänge in Sekunden</label>
      <input id="len" name="len" type="number" inputmode="numeric" min="10" max="900" step="5" placeholder="Länge (s)">
      <label class="sr" for="voice">Sprecherstimme (Englisch)</label>
      <select id="voice" name="voice" title="Sprecherstimme im Video (Englisch)">
        <option value="af_heart" selected>Stimme: Lily – Frau (empfohlen)</option>
        <option value="af_bella">Stimme: Bella – Frau</option>
        <option value="am_fenrir">Stimme: Finn – Mann</option>
        <option value="am_puck">Stimme: Max – Mann</option>
      </select>
      <button class="btn-quiet listen" id="listenBtn" type="button" aria-label="Hörprobe der gewählten Stimme abspielen">▶ Anhören</button>
      <label class="sr" for="note">Notiz</label>
      <input id="note" name="note" placeholder="Notiz (optional)" maxlength="500">
      <button class="btn-primary" id="addBtn" type="submit">Thema hinzufügen</button>
    </div>
    <div class="insp-pick" id="inspPick" hidden>
      <label class="filebtn" for="inspFiles">Bilder zur Inspiration anhängen</label>
      <input id="inspFiles" type="file" accept="image/*,video/*,application/pdf" multiple>
      <span class="hint" id="inspCount">optional – Bilder, kurze Videos oder PDFs</span>
    </div>
    <p class="hint">Claude schaut stündlich (7–23 Uhr) nach neuen Themen und Entscheidungen. Stil wie das Sonnensystem-Video.</p>
    <p class="msg" id="addMsg" role="status"></p>
    <p class="wake" id="wakeMsg" role="status" hidden></p>
  </form>

  <details class="ht" id="repoBox" hidden>
    <summary id="repoSum">Repo-Stand</summary>
    <div id="repoBody"></div>
  </details>

  <details class="ht" id="htBox" hidden>
    <summary id="htSum">Hashtags</summary>
    <div id="htBody"></div>
  </details>

  <section id="list" aria-live="polite">
    <p class="empty" id="empty">Noch keine Videos. Trage oben ein Thema ein – eine Claude-Sitzung übernimmt es dann.</p>
  </section>
</div>

<script>
(() => {
  const STEPS = [
    ["research", "Recherche"], ["script", "Drehbuch"], ["scenes", "Szenen"], ["render", "Render"], ["done", "Fertig"]
  ];
  const STAGE_LABEL = { queued: "Wartet", research: "Recherche", script: "Drehbuch", scenes: "Szenen", render: "Render", done: "Fertig", error: "Fehler" };
  const REPO = "https://github.com/xle0n221/clips/tree/";

  const $ = (id) => document.getElementById(id);
  const listEl = $("list"), emptyEl = $("empty"), summaryEl = $("summary");
  let db = null, art = null, assets = null, canWrite = true, docs = [], loaded = false;
  const VOICE_NAME = { af_heart: "Lily", af_bella: "Bella", am_fenrir: "Finn", am_puck: "Max" };
  const voiceName = (v) => VOICE_NAME[v] ? "Stimme " + VOICE_NAME[v] : "Stimme " + v;
  const blobUrl = (id) => "/_blob/" + encodeURIComponent(id);
  const WPS_MIN = 3.3, WPS_MAX = 3.6; // Ziel-Sprechtempo (Vorgabe aus der Video-Produktion)
  const de = (n, d) => n.toLocaleString("de-DE", { minimumFractionDigits: d, maximumFractionDigits: d });
  const sceneDrafts = {};
  const drafts = {};      // Feedback-Entwürfe je Video, überleben Neuzeichnen
  const busy = {};        // laufende Schreibvorgänge je Video
  const confirmDel = {};  // zweistufiges Entfernen

  function el(tag, attrs, ...kids) {
    const n = document.createElement(tag);
    if (attrs) for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === "class") n.className = v;
      else if (k === "text") n.textContent = v;
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? "" : v);
    }
    for (const c of kids.flat()) if (c != null && c !== false) n.append(c.nodeType ? c : document.createTextNode(String(c)));
    return n;
  }
  const safeUrl = (u) => {
    if (typeof u !== "string" || !u) return null;
    if (u.startsWith("/_blob/") || u.startsWith("data:image/")) return u;
    try { const p = new URL(u); return (p.protocol === "https:" || p.protocol === "http:") ? p.href : null; } catch { return null; }
  };
  function ago(iso) {
    const t = Date.parse(iso); if (!t) return "–";
    const s = Math.round((Date.now() - t) / 1000);
    if (s < 60) return "gerade eben";
    const m = Math.round(s / 60); if (m < 60) return `vor ${m} Min.`;
    const h = Math.round(m / 60); if (h < 24) return `vor ${h} Std.`;
    return new Date(t).toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
  }
  const absTime = (iso) => { const t = Date.parse(iso); return t ? new Date(t).toLocaleString("de-DE") : ""; };
  const tc = (sec) => { sec = Math.round(sec); return `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, "0")}`; };
  const waiting = (v) => v.review && !v.decision && v.stage !== "done";
  const blocked = (v) => typeof v.actionNeeded === "string" && v.actionNeeded.trim() !== "";
  function rank(v) {
    if (waiting(v) || blocked(v)) return 0;
    if (v.stage === "error") return 1;
    if (["research", "script", "scenes", "render"].includes(v.stage)) return 2;
    if (v.stage === "queued") return 3;
    return 4;
  }
  function slugify(s) {
    const map = { "ä": "ae", "ö": "oe", "ü": "ue", "ß": "ss" };
    let x = s.toLowerCase().replace(/[äöüß]/g, (c) => map[c]).normalize("NFKD").replace(/[\u0300-\u036f]/g, "")
      .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 40).replace(/-+$/, "");
    if (!x) x = "video";
    const ids = new Set(docs.map((d) => d.id));
    let id = x, i = 2;
    while (ids.has(id)) id = `${x}-${i++}`;
    return id;
  }

  function steps(stage) {
    const idx = STEPS.findIndex(([k]) => k === stage);
    return el("ol", { class: "steps", "aria-label": "Fortschritt" },
      STEPS.map(([k, label], i) => {
        let cls = "";
        if (stage === "done") cls = "past";
        else if (stage === "error") cls = "";
        else if (idx >= 0 && i < idx) cls = "past";
        else if (i === idx) cls = "now";
        return el("li", { class: cls, "aria-current": i === idx && stage !== "done" ? "step" : null }, el("span", { text: label }));
      }));
  }

  function pill(v) {
    if (blocked(v)) return el("span", { class: "pill bad", text: "Aktion nötig" });
    if (waiting(v)) return el("span", { class: "pill warn", text: "Freigabe nötig" });
    if (v.review && v.decision && v.stage !== "done") return el("span", { class: "pill", text: "Wartet auf Claude" });
    const cls = v.stage === "done" ? "ok" : v.stage === "error" ? "bad" : v.stage === "queued" ? "idle" : "";
    return el("span", { class: "pill " + cls, text: STAGE_LABEL[v.stage] || v.stage || "?" });
  }

  function reviewBlock(v) {
    const r = v.review;
    const box = el("div", { class: "review" });
    box.append(el("h3", { text: r.kind === "contactsheet" ? "Stufe 2 · Kontaktabzug prüfen (vor dem finalen Render)" : "Stufe 1 · Drehbuch und Quellen prüfen" }));
    if (r.title) box.append(el("p", { class: "rtitle", text: r.title }));
    const img = safeUrl(r.imageUrl);
    if (img) box.append(el("a", { href: img, target: "_blank", rel: "noopener" }, el("img", { src: img, alt: r.title || "Kontaktabzug", loading: "lazy" })));
    if (r.text) box.append(el("pre", { class: "script", text: r.text }));
    if (Array.isArray(r.corrections) && r.corrections.length) {
      box.append(el("div", { class: "fix" },
        el("strong", { text: "Abweichungen von gängigen Angaben" }),
        el("ul", null, r.corrections.map((c) => el("li", null,
          el("b", { text: (c && c.claim) || "" }), c && c.note ? " – " + c.note : "")))));
    }
    if (Array.isArray(r.sources) && r.sources.length) {
      box.append(el("details", null,
        el("summary", { text: `Quellen (${r.sources.length})` }),
        el("ol", { class: "sources" }, r.sources.map((s) => {
          const u = safeUrl(s && s.url);
          return el("li", null,
            el("span", { text: (s && s.claim) || "" }),
            s && s.quote ? el("q", { text: s.quote }) : null,
            u ? el("a", { href: u, target: "_blank", rel: "noopener noreferrer", text: u.replace(/^https?:\/\//, "") }) : null);
        }))));
    }

    if (v.decision) {
      const ok = v.decision.value === "ok";
      box.append(el("div", { class: "saved" },
        el("p", { class: "who " + (ok ? "ok" : "bad"), text: (ok ? "OK" : "Nicht OK") + " – Entscheidung gespeichert, wartet auf Claude" }),
        v.decision.scene ? el("p", { text: "Szene: " + sceneLabel(r, v.decision.scene) }) : null,
        v.decision.feedback ? el("p", { text: "Feedback: " + v.decision.feedback }) : null,
        el("p", { class: "meta", text: absTime(v.decision.at) }),
        canWrite ? el("div", null, el("button", { class: "btn-quiet", type: "button", disabled: busy[v.id], onclick: () => decide(v, null), text: "Entscheidung zurücknehmen" })) : null));
    } else if (canWrite) {
      const fbId = "fb-" + v.id;
      const ta = el("textarea", { id: fbId, placeholder: "Feedback (bei „Nicht OK“ bitte angeben, was geändert werden soll)", maxlength: "4000",
        oninput: (e) => { drafts[v.id] = e.target.value; } });
      ta.value = drafts[v.id] || "";
      const msg = el("p", { class: "msg err", role: "status" });
      const scenes = Array.isArray(r.scenes) ? r.scenes.filter((x) => x && x.id) : [];
      let sel = null;
      if (scenes.length) {
        sel = el("select", { id: "sc-" + v.id, onchange: (e) => { sceneDrafts[v.id] = e.target.value; } },
          el("option", { value: "", text: "Betrifft: ganzes Video" }),
          scenes.map((x) => el("option", { value: String(x.id), text: "Betrifft: " + (x.label || x.id) })));
        sel.value = sceneDrafts[v.id] || "";
      }
      const send = (value) => {
        const fb = ta.value.trim();
        if (value === "not_ok" && !fb) { msg.textContent = "Bitte kurz schreiben, was nicht passt."; ta.focus(); return; }
        decide(v, { value, feedback: fb, scene: sel && sel.value ? sel.value : null, at: new Date().toISOString() }, msg);
      };
      box.append(el("div", { class: "decide" },
        sel ? el("label", { class: "sr", for: "sc-" + v.id, text: "Betrifft Szene" }) : null, sel,
        el("label", { class: "sr", for: fbId, text: "Feedback" }), ta,
        el("div", { class: "row" },
          el("button", { class: "btn-ok", type: "button", disabled: busy[v.id], onclick: () => send("ok"), text: "OK" }),
          el("button", { class: "btn-bad", type: "button", disabled: busy[v.id], onclick: () => send("not_ok"), text: "Nicht OK" })),
        msg));
    } else {
      box.append(el("p", { class: "hint", text: "Nur Lesezugriff – Entscheidungen kann hier nur der Besitzer treffen." }));
    }
    return box;
  }

  function doneBlock(v) {
    const box = el("div", { class: "done-box" });
    const prev = safeUrl(v.previewUrl);
    if (prev) box.append(/\.(png|jpe?g|webp|gif)(\?|$)/i.test(prev) || prev.startsWith("data:image/")
      ? el("img", { src: prev, alt: "Vorschau", loading: "lazy" })
      : el("video", { src: prev, controls: true, preload: "metadata", playsinline: true }));
    box.append(el("p", { class: "status", text: "Das fertige Video liegt in der Claude-App (Sitzung des Bearbeiters)." }));
    if (typeof v.fileSizeBytes === "number" && v.fileSizeBytes > 0) box.append(el("p", { class: "meta", text: "Datei " + de(v.fileSizeBytes / 1e6, 1) + " MB" }));
    if (v.branch) box.append(el("p", { class: "status" }, "Branch: ", el("a", { href: REPO + encodeURIComponent(v.branch).replace(/%2F/g, "/"), target: "_blank", rel: "noopener", text: v.branch })));
    return box;
  }

  function sceneLabel(r, id) {
    const x = r && Array.isArray(r.scenes) ? r.scenes.find((s) => s && String(s.id) === String(id)) : null;
    return (x && x.label) || String(id);
  }

  function metricsLine(m) {
    if (!m || typeof m !== "object") return null;
    const out = [];
    if (typeof m.durationSec === "number") out.push(el("span", { text: "Länge " + tc(m.durationSec) }));
    if (typeof m.words === "number") out.push(el("span", { text: m.words + " Wörter" }));
    if (typeof m.wordsPerSec === "number") {
      const off = m.wordsPerSec < WPS_MIN || m.wordsPerSec > WPS_MAX;
      out.push(el("span", { class: off ? "off" : "good", title: `Ziel ${de(WPS_MIN, 1)}–${de(WPS_MAX, 1)} Wörter/s`,
        text: de(m.wordsPerSec, 2) + " W/s" + (off ? " (Ziel " + de(WPS_MIN, 1) + "–" + de(WPS_MAX, 1) + ")" : "") }));
    }
    if (typeof m.whisperMatch === "string" && m.whisperMatch) {
      const p = m.whisperMatch.split("/").map(Number);
      const off = p.length === 2 && Number.isFinite(p[0]) && p[0] !== p[1];
      out.push(el("span", { class: off ? "off" : "good", title: "Aussprache-Gegenprobe: von Whisper erkannte / geschriebene Wörter", text: "Whisper " + m.whisperMatch }));
    }
    if (typeof m.voice === "string" && m.voice) out.push(el("span", { text: voiceName(m.voice) }));
    return out.length ? el("p", { class: "metrics" }, out) : null;
  }

  function progressBlock(v) {
    if (v.stage !== "render" || typeof v.renderProgress !== "number") return null;
    const p = Math.max(0, Math.min(1, v.renderProgress));
    return el("div", { class: "progress" },
      el("div", { class: "bar", role: "progressbar", "aria-valuemin": "0", "aria-valuemax": "100", "aria-valuenow": String(Math.round(p * 100)), "aria-label": "Render-Fortschritt" },
        el("i", { style: "width:" + (p * 100).toFixed(1) + "%" })),
      el("span", { text: "Render " + Math.round(p * 100) + " %" + (v.renderEta ? " · " + v.renderEta : "") }));
  }

  async function uploadAll(fileList, onStep) {
    const out = [];
    const files = Array.from(fileList || []);
    for (let i = 0; i < files.length; i++) {
      const f = files[i];
      onStep && onStep(i + 1, files.length);
      const r = await assets.upload(f);
      out.push({ id: r.id, name: f.name.slice(0, 120), type: r.contentType || f.type || "" });
    }
    return out;
  }

  function inspBlock(v) {
    const list = Array.isArray(v.inspiration) ? v.inspiration.filter((x) => x && x.id) : [];
    const canAdd = canWrite && assets && ["queued", "research", "script"].includes(v.stage);
    if (!list.length && !canAdd) return null;
    const box = el("div", { class: "insp" });
    if (list.length) {
      box.append(el("p", { class: "insp-title", text: `Inspiration (${list.length})` }));
      box.append(el("div", { class: "thumbs" }, list.map((x) => {
        const u = blobUrl(x.id);
        const isImg = String(x.type || "").startsWith("image/");
        return el("a", { href: u, target: "_blank", rel: "noopener", title: x.name || "", class: isImg ? null : "file" },
          isImg ? el("img", { src: u, alt: x.name || "Inspirationsbild", loading: "lazy" }) : (x.name || "Datei"));
      })));
    }
    if (canAdd) {
      const fid = "add-" + v.id;
      const msg = el("span", { class: "hint", role: "status" });
      const input = el("input", { id: fid, type: "file", accept: "image/*,video/*,application/pdf", multiple: true,
        onchange: async (e) => {
          const files = e.target.files; if (!files || !files.length) return;
          busy[v.id] = true;
          try {
            const added = await uploadAll(files, (i, n) => { msg.textContent = `Lade ${i} von ${n} hoch …`; });
            const cur = docs.find((d) => d.id === v.id);
            const base = cur && Array.isArray(cur.inspiration) ? cur.inspiration : [];
            await db.collection("videos").doc(v.id).update({ inspiration: base.concat(added), updatedAt: new Date().toISOString() });
            wake("inspiration", v.id);
          } catch (err) {
            msg.textContent = "Hochladen fehlgeschlagen (" + (err && err.code || "Fehler") + ").";
            busy[v.id] = false; return;
          }
          busy[v.id] = false; render();
        } });
      box.append(el("div", { class: "insp-pick" },
        el("label", { class: "filebtn", for: fid, text: list.length ? "+ Weitere Bilder" : "+ Bilder zur Inspiration" }), input, msg));
    }
    return box;
  }

  // Plattform-Grenzen (Quellen siehe dashboard/README.md, Abschnitt „Veröffentlichen“)
  const YT_TITLE_MAX = 100, YT_TAGS_MAX = 60, TT_TAGS_MAX = 5, TT_CAPTION_SAFE = 2200;
  const tagList = (a) => (Array.isArray(a) ? a : []).map((t) => String(t).trim()).filter(Boolean).map((t) => t.startsWith("#") ? t : "#" + t);

  function copyBtn(label, getText) {
    const b = el("button", { class: "btn-quiet", type: "button", text: label });
    b.addEventListener("click", () => {
      const text = getText();
      const done = () => { b.textContent = "Kopiert ✓"; setTimeout(() => { b.textContent = label; }, 1500); };
      const fallback = () => {
        const ta = el("textarea", { readonly: true, style: "position:fixed;opacity:0" }); ta.value = text;
        document.body.append(ta); ta.select();
        try { document.execCommand("copy"); done(); } catch { b.textContent = "Bitte manuell kopieren"; }
        ta.remove();
      };
      try { navigator.clipboard.writeText(text).then(done, fallback); } catch { fallback(); }
    });
    return b;
  }

  function publishBlock(v) {
    const p = v.publish;
    if (!p || typeof p !== "object") return null;
    const box = el("details", { class: "pub", open: v.stage === "done" ? true : null },
      el("summary", { text: "Veröffentlichen: Titel, Texte, Hashtags" }));
    const yt = p.youtube, tt = p.tiktok;
    if (yt && typeof yt === "object") {
      const tags = tagList(yt.hashtags);
      const title = String(yt.title || ""), desc = String(yt.description || "");
      const full = [desc, tags.join(" ")].filter(Boolean).join("\n\n");
      const warns = [];
      if (title.length > YT_TITLE_MAX) warns.push(`Titel hat ${title.length} Zeichen (YouTube erlaubt ${YT_TITLE_MAX}).`);
      if (tags.length > YT_TAGS_MAX) warns.push(`${tags.length} Hashtags: über ${YT_TAGS_MAX} ignoriert YouTube alle.`);
      box.append(el("div", { class: "plat" },
        el("h4", { text: "YouTube Shorts" }),
        el("p", { class: "lbl", text: `Titel (${title.length}/${YT_TITLE_MAX})` }),
        el("p", { class: "txt", text: title || "–" }),
        desc ? el("p", { class: "lbl", text: "Beschreibung" }) : null,
        desc ? el("p", { class: "txt", text: desc }) : null,
        tags.length ? el("p", { class: "tags", text: tags.join(" ") }) : null,
        tags.length ? el("p", { class: "lbl", text: "Bis zu 3 Hashtags zeigt YouTube über dem Titel an." }) : null,
        warns.map((w) => el("p", { class: "warn", text: w })),
        el("div", { class: "copyrow" }, copyBtn("Titel kopieren", () => title), copyBtn("Beschreibung + Hashtags kopieren", () => full))));
    }
    if (tt && typeof tt === "object") {
      const tags = tagList(tt.hashtags);
      const cap = String(tt.caption || "");
      const full = [cap, tags.join(" ")].filter(Boolean).join(" ");
      const warns = [];
      if (tags.length > TT_TAGS_MAX) warns.push(`${tags.length} Hashtags: TikTok erlaubt laut Berichten nur ${TT_TAGS_MAX} pro Post.`);
      if (full.length > TT_CAPTION_SAFE) warns.push(`Text hat ${full.length} Zeichen; sicher sind ${TT_CAPTION_SAFE}.`);
      box.append(el("div", { class: "plat" },
        el("h4", { text: "TikTok" }),
        el("p", { class: "lbl", text: `Caption (${full.length} Zeichen mit Hashtags)` }),
        el("p", { class: "txt", text: cap || "–" }),
        tags.length ? el("p", { class: "tags", text: tags.join(" ") }) : null,
        warns.map((w) => el("p", { class: "warn", text: w })),
        el("div", { class: "copyrow" }, copyBtn("Caption + Hashtags kopieren", () => full))));
    }
    if (p.note) box.append(el("p", { class: "hint", style: "margin-top:8px", text: String(p.note) }));
    return box;
  }

  function renderHashtags(h) {
    const box = $("htBox");
    if (!h || typeof h !== "object") { box.hidden = true; return; }
    box.hidden = false;
    const t = Date.parse(h.updatedAt);
    $("htSum").replaceChildren("Hashtags ", el("span", { class: "sub", text: t ? "· Stand " + new Date(t).toLocaleDateString("de-DE") + (h.nextUpdate ? " · nächste Prüfung " + h.nextUpdate : "") : "" }));
    const body = $("htBody"); body.replaceChildren();
    const trend = (c) => {
      const m = { up: ["▲", "up", "gestiegen"], down: ["▼", "down", "gesunken"], new: ["neu", "new", "neu in der Liste"], same: ["=", "", "unverändert"] }[c];
      return m ? el("span", { class: m[1], title: m[2], text: m[0] }) : "";
    };
    const table = (rows) => el("div", { class: "ht-scroll" }, el("table", null,
      el("thead", null, el("tr", null, ["Hashtag", "Kennzahl", "Trend", "Quelle"].map((x) => el("th", { text: x })))),
      el("tbody", null, rows.map((r) => {
        const u = safeUrl(r.url);
        return el("tr", null,
          el("td", { class: "tag", text: r.tag && String(r.tag).startsWith("#") ? r.tag : "#" + (r.tag || "") }),
          el("td", { text: r.metric || "–" }),
          el("td", null, trend(r.change)),
          el("td", null, u ? el("a", { href: u, target: "_blank", rel: "noopener noreferrer", text: r.source || "Link" }) : (r.source || "–")));
      }))));
    for (const [key, label] of [["tiktok", "TikTok"], ["youtube", "YouTube Shorts"]]) {
      const pl = h[key]; if (!pl) continue;
      body.append(el("h3", { text: label }));
      (Array.isArray(pl.combos) ? pl.combos : []).forEach((c) => {
        const tags = tagList(c.tags).join(" ");
        body.append(el("div", { class: "combo" }, el("span", { class: "hint", text: (c.label || "Empfohlen") + ":" }), el("code", { text: tags }), copyBtn("Kopieren", () => tags)));
      });
      if (Array.isArray(pl.tags) && pl.tags.length) body.append(table(pl.tags));
    }
    if (Array.isArray(h.notes) && h.notes.length) body.append(el("ul", { class: "notes" }, h.notes.map((n) => el("li", { text: String(n) }))));
  }

  // Repo-Stand: wird nach jedem Push von der Sitzung „CLIPS“ in meta/repo geschrieben
  function renderRepo(r) {
    const box = $("repoBox");
    if (!r || typeof r !== "object") { box.hidden = true; return; }
    box.hidden = false;
    const t = Date.parse(r.updatedAt);
    $("repoSum").replaceChildren("Repo-Stand ", el("span", { class: "sub",
      text: (r.commit ? "· " + String(r.commit).slice(0, 7) : "") + (t ? " · " + new Date(t).toLocaleString("de-DE", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) : "") }));
    const body = $("repoBody"); body.replaceChildren();
    if (r.branch) body.append(el("p", { class: "status" }, "Branch: ", el("a", { href: REPO + encodeURIComponent(r.branch).replace(/%2F/g, "/"), target: "_blank", rel: "noopener", text: r.branch })));
    if (r.summary) body.append(el("p", { class: "status", text: String(r.summary) }));
    const ch = Array.isArray(r.changes) ? r.changes : [];
    if (ch.length) {
      body.append(el("h3", { text: "Letzte Verbesserungen" }));
      body.append(el("ul", { class: "notes" }, ch.slice(0, 12).map((c) => el("li", null,
        c && c.date ? el("span", { class: "tc", text: String(c.date).slice(0, 10) + " " }) : null,
        String((c && c.text) || c)))));
    }
  }

  function card(v) {
    const metaParts = [];
    if (typeof v.lengthSec === "number" && v.lengthSec > 0) metaParts.push(el("span", { class: "tc", title: "Wunschlänge", text: tc(v.lengthSec) }));
    metaParts.push(el("span", { title: absTime(v.updatedAt), text: "geändert " + ago(v.updatedAt) }));
    if (v.voice) metaParts.push(el("span", { text: voiceName(v.voice) }));
    if (v.branch && v.stage !== "done") metaParts.push(el("span", { text: v.branch }));

    const c = el("article", { class: "card" + (waiting(v) || blocked(v) ? " attn" : ""), id: "v-" + v.id },
      el("div", { class: "card-head" },
        el("div", null, el("h2", { text: v.topic || v.id }), el("div", { class: "meta" }, metaParts)),
        pill(v)),
      blocked(v) ? el("p", { class: "banner", role: "alert", text: "Aktion nötig: " + v.actionNeeded }) : null,
      steps(v.stage),
      progressBlock(v),
      v.statusText ? el("p", { class: "status" + (v.stage === "error" ? " err" : ""), text: v.statusText })
        : el("p", { class: "status hint", text: v.stage === "queued" ? "Wartet darauf, dass eine Claude-Sitzung das Thema übernimmt." : "" }),
      metricsLine(v.metrics),
      v.note ? el("p", { class: "note", text: "Notiz: " + v.note }) : null,
      inspBlock(v));

    if (v.review && v.stage !== "done") c.append(reviewBlock(v));
    if (v.stage === "done") c.append(doneBlock(v));
    const pub = publishBlock(v); if (pub) c.append(pub);

    if (canWrite && v.stage === "queued") {
      const armed = confirmDel[v.id];
      c.append(el("div", { class: "foot" },
        el("button", { class: "btn-quiet", type: "button", disabled: busy[v.id],
          onclick: () => { if (!armed) { confirmDel[v.id] = true; render(); setTimeout(() => { confirmDel[v.id] = false; render(); }, 5000); } else remove(v); },
          text: armed ? "Wirklich entfernen?" : "Entfernen" })));
    }
    return c;
  }

  function render() {
    const focusId = document.activeElement && document.activeElement.id;
    const sorted = docs.slice().sort((a, b) => rank(a) - rank(b) || String(b.updatedAt || "").localeCompare(String(a.updatedAt || "")));
    listEl.replaceChildren(...(sorted.length ? sorted.map(card) : [emptyEl]));
    if (focusId && $(focusId) && $(focusId).tagName === "TEXTAREA") { const t = $(focusId); t.focus(); t.setSelectionRange(t.value.length, t.value.length); }
    if (!loaded) return;
    const nWait = docs.filter((v) => waiting(v) || blocked(v)).length;
    const nRun = docs.filter((v) => ["research", "script", "scenes", "render"].includes(v.stage)).length;
    const nDone = docs.filter((v) => v.stage === "done").length;
    const parts = [];
    if (nWait) parts.push(`<b>${nWait} zu erledigen</b>`);
    parts.push(`${nRun} in Arbeit`, `${docs.filter((v) => v.stage === "queued").length} wartend`, `${nDone} fertig`);
    summaryEl.innerHTML = parts.join(" · ");
  }

  // Weckt beobachtende Claude-Sitzungen: speichert eine kleine Datei als neue Seitenversion.
  // Die Daten selbst bleiben in der Datenbank; diese Datei ist nur das Signal.
  async function wake(action, id) {
    const w = $("wakeMsg");
    const hint = (why) => {
      w.hidden = false; w.className = "wake warn";
      w.textContent = "Claude wird nicht automatisch geweckt" + (why ? " (" + why + ")" : "") +
        ". Gespeichert ist es trotzdem – Claude holt es beim nächsten stündlichen Durchlauf ab.";
    };
    if (!art) { hint("Funktion hier nicht verfügbar"); return; }
    try {
      await art.publish({ "last-action.json": JSON.stringify({ action, id, at: new Date().toISOString() }) });
      w.hidden = false; w.className = "wake ok";
      w.textContent = "Gespeichert (" + new Date().toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" }) + "). Claude holt es beim nächsten stündlichen Durchlauf ab.";
    } catch (e) {
      if (e && e.code === "conflict") return; // Seite lädt ohnehin die neueste Version
      hint(e && e.code);
    }
  }

  async function decide(v, decision, msgEl) {
    if (!db || busy[v.id]) return;
    busy[v.id] = true; render();
    try {
      await db.collection("videos").doc(v.id).update({ decision, updatedAt: new Date().toISOString() });
      if (decision) { delete drafts[v.id]; delete sceneDrafts[v.id]; }
      busy[v.id] = false; render();
      wake(decision ? "decision:" + decision.value : "decision:undo", v.id);
    } catch (e) {
      if (msgEl) msgEl.textContent = "Speichern fehlgeschlagen (" + (e && e.code || "Fehler") + "). Bitte erneut versuchen.";
      if (e && e.code === "invalid_argument") canWrite = false;
    } finally { busy[v.id] = false; render(); }
  }

  async function remove(v) {
    if (!db) return;
    busy[v.id] = true; render();
    try { await db.collection("videos").doc(v.id).delete(); } catch {}
    busy[v.id] = false; confirmDel[v.id] = false; render();
  }

  // Hörproben: jede Stimme stellt sich kurz selbst vor (Dateien neben der Seite, voices/voice-<id>.mp3)
  let player = null;
  $("listenBtn").addEventListener("click", () => {
    const btn = $("listenBtn");
    if (player && !player.paused) { player.pause(); btn.textContent = "▶ Anhören"; return; }
    player = new Audio("voices/voice-" + $("voice").value + ".mp3");
    btn.textContent = "■ Stopp";
    player.addEventListener("ended", () => { btn.textContent = "▶ Anhören"; });
    player.play().catch(() => { btn.textContent = "▶ Anhören"; $("addMsg").className = "msg err"; $("addMsg").textContent = "Hörprobe konnte nicht abgespielt werden."; });
  });
  $("voice").addEventListener("change", () => { if (player) { player.pause(); $("listenBtn").textContent = "▶ Anhören"; } });

  $("inspFiles").addEventListener("change", (e) => {
    const n = e.target.files ? e.target.files.length : 0;
    $("inspCount").textContent = n ? `${n} Datei${n === 1 ? "" : "en"} ausgewählt` : "optional – Bilder, kurze Videos oder PDFs";
  });

  $("addForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const msg = $("addMsg"); msg.className = "msg"; msg.textContent = "";
    const topic = $("topic").value.trim();
    if (!topic) return;
    if (!db) { msg.className = "msg err"; msg.textContent = "Keine Verbindung zur Datenbank. Seite in der Claude-App angemeldet öffnen."; return; }
    const lenRaw = $("len").value.trim();
    const lengthSec = lenRaw ? Math.round(Number(lenRaw)) : null;
    const id = slugify(topic);
    const btn = $("addBtn"); btn.disabled = true;
    try {
      let inspiration = [];
      const files = $("inspFiles").files;
      if (assets && files && files.length) {
        inspiration = await uploadAll(files, (i, n) => { msg.textContent = `Lade Bild ${i} von ${n} hoch …`; });
      }
      await db.collection("videos").doc(id).set({
        inspiration,
        topic, lengthSec: Number.isFinite(lengthSec) && lengthSec > 0 ? lengthSec : null, note: $("note").value.trim(),
        voice: $("voice").value || "af_heart",
        stage: "queued", statusText: "", review: null, decision: null,
        branch: null, sessionId: null, updatedAt: new Date().toISOString()
      });
      $("topic").value = ""; $("len").value = ""; $("note").value = ""; $("voice").value = "af_heart";
      $("inspFiles").value = ""; $("inspCount").textContent = "optional – Bilder, kurze Videos oder PDFs";
      msg.textContent = `„${topic}“ hinzugefügt (ID ${id}).`;
      wake("add", id);
    } catch (err) {
      msg.className = "msg err";
      msg.textContent = err && err.code === "invalid_argument"
        ? "Keine Schreibrechte für diese Seite."
        : "Speichern fehlgeschlagen (" + (err && err.code || "Fehler") + "). Bitte erneut versuchen.";
    } finally { btn.disabled = false; }
  });

  async function start() {
    if (!window.claude || typeof window.claude.use !== "function") {
      summaryEl.textContent = "Nur in claude.ai nutzbar";
      emptyEl.textContent = "Diese Seite braucht die gemeinsame Datenbank von claude.ai. Bitte dort angemeldet öffnen.";
      return;
    }
    const [dbNs, user, artNs, assetsNs] = await Promise.all([window.claude.use("db"), window.claude.use("user"), window.claude.use("artifact"), window.claude.use("assets")]);
    db = dbNs; art = artNs; assets = assetsNs;
    if (assets) $("inspPick").hidden = false;
    if (!db) {
      summaryEl.textContent = "Keine Datenbank";
      emptyEl.textContent = "Die Datenbank ist in dieser Ansicht nicht verfügbar. Bitte in claude.ai angemeldet öffnen.";
      $("addBtn").disabled = true;
      return;
    }
    if (user) { try { const w = await user.can("data.write"); if (w === false) canWrite = false; } catch {} }
    if (!canWrite) { $("addForm").hidden = true; }
    const timer = setTimeout(() => { if (!loaded) summaryEl.textContent = "Daten noch nicht erreichbar …"; }, 10000);
    db.collection("videos").onSnapshot((snap) => {
      docs = snap.docs.filter((d) => d.exists).map((d) => ({ id: d.id, ...d.data() }));
      if (!snap.metadata.fromCache) { loaded = true; clearTimeout(timer); }
      if (!loaded && !docs.length) return;
      loaded = true; render();
    }, (err) => {
      clearTimeout(timer);
      summaryEl.textContent = "Verbindung verloren (" + (err && err.code) + ")";
    });
    db.doc("hashtags/current").onSnapshot((d) => renderHashtags(d.exists ? d.data() : null), () => {});
    db.doc("meta/repo").onSnapshot((d) => renderRepo(d.exists ? d.data() : null), () => {});
    setInterval(render, 60000); // nur relative Zeitangaben auffrischen, kein Schreiben
  }
  start();
})();
</script>
